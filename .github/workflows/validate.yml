name: Validate Omega

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python scripts/validate_skill.py .
      - name: Static architecture evals
        run: python scripts/run_static_evals.py .
      - name: Validator regression suite
        run: python scripts/test_validator.py
      - name: Scaffolder hostile-input regression
        run: python scripts/test_scaffolder.py
      - name: Empirical harness regression
        run: python scripts/test_eval_harness.py
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Package and revalidate archives
        run: python scripts/package_skill.py .
      - name: Stage installable skill bundles
        run: |
          cp ../prompt-architect-omega.zip ./prompt-architect-omega.zip
          cp ../prompt-architect-omega.skill ./prompt-architect-omega.skill
      - name: Upload installable skill bundles
        uses: actions/upload-artifact@v4
        with:
          name: prompt-architect-omega-${{ github.sha }}
          path: |
            prompt-architect-omega.zip
            prompt-architect-omega.skill
          if-no-files-found: error
